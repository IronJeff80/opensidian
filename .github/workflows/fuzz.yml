# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-fuzz over the attacker-reachable parsers (fuzz/README in fuzz/Cargo.toml).
# PR: 60 s per target. Weekly cron: 30 min per target. NOT a required check.
# Supply chain: every action pinned by full commit SHA (tag + commit date in the
# comment, each <= 2026-09-13); toolchain = the dated nightly in
# fuzz/rust-toolchain.toml; cargo-fuzz = exact version, --locked; fuzz/Cargo.lock
# is committed and the job fails if the build changes it.
name: fuzz

on:
  pull_request:
    paths: ["src-tauri/src/**", "src-tauri/Cargo.*", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [vault_path, outline_index, graphq, canvas, datefmt]
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      SECS: ${{ github.event_name == 'pull_request' && '60' || '1800' }}
    steps:
      - name: checkout
        # actions/checkout v7.0.1, commit 2026-07-17
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: system libs (tauri is a dependency of the lib's package)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: toolchain (dated nightly from fuzz/rust-toolchain.toml)
        run: |
          TC=$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)
          case "$TC" in nightly-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::toolchain not a dated nightly: $TC"; exit 1;; esac
          rustup toolchain install "$TC" --profile minimal --no-self-update
          echo "TC=$TC" >> "$GITHUB_ENV"

      - name: cargo-fuzz (exact version, locked)
        run: cargo "+$TC" install --locked --version "=$CARGO_FUZZ_VERSION" cargo-fuzz

      - name: build
        run: |
          cp fuzz/Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed"
          cargo "+$TC" fuzz build --fuzz-dir fuzz "${{ matrix.target }}"
          cmp fuzz/Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed" || { echo "::error::fuzz/Cargo.lock drifted"; exit 1; }

      - name: replay triaged crashes (regressions must stay fixed)
        run: |
          d="fuzz/artifacts-triaged/${{ matrix.target }}"
          [ -d "$d" ] || { echo "none for ${{ matrix.target }}"; exit 0; }
          cargo "+$TC" fuzz run --fuzz-dir fuzz "${{ matrix.target }}" "$d"/* -- -runs=0

      - name: fuzz ${{ matrix.target }} for ${{ env.SECS }}s
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cp "fuzz/corpus/${{ matrix.target }}"/* "$RUNNER_TEMP/corpus/"
          cargo "+$TC" fuzz run --fuzz-dir fuzz "${{ matrix.target }}" "$RUNNER_TEMP/corpus" -- \
            -max_total_time="$SECS" -print_final_stats=1 -rss_limit_mb=2048 -max_len=65536 -timeout=30 -close_fd_mask=2

      - name: keep crash inputs
        if: failure()
        # actions/upload-artifact v7.0.1, commit 2026-04-10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 14
          if-no-files-found: ignore
